name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Erlaubt manuelles Auslösen im Actions-Tab
  workflow_dispatch:

# Nur die Rechte, die der Deploy wirklich braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deploy, wird der nächste angestellt statt abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mit Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
